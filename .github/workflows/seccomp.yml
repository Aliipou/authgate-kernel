name: Seccomp enforcement

# Linux-only: syscall-level adversarial tests for Python tool subprocess isolation.
# Closes the subprocess/ctypes bypass documented in AT-7.5 / gap #3.

on:
  push:
    branches: [main, integration, tcb-core, with-legitimacy]
    paths:
      - "src/authgate/kernel/seccomp_executor.py"
      - "tests/test_seccomp_adversarial.py"
      - ".github/workflows/seccomp.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/authgate/kernel/seccomp_executor.py"
      - "tests/test_seccomp_adversarial.py"

permissions:
  contents: read

jobs:
  seccomp-adversarial:
    name: Seccomp — execve blocked (read-only rights)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libseccomp
        run: sudo apt-get update && sudo apt-get install -y libseccomp2 libseccomp-dev

      - run: pip install -e ".[dev]"

      - name: Rights-derived allowlist unit tests
        run: pytest tests/test_seccomp_adversarial.py::TestSeccompAllowlist -v

      - name: Adversarial — execve killed under read-only seccomp
        run: pytest tests/test_seccomp_adversarial.py::TestSeccompAdversarial::test_execve_killed_under_read_only_allowlist -v
