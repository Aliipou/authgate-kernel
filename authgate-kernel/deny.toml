[advisories]
version = 2
ignore = [
  "RUSTSEC-2025-0020",
  # wasmtime 25.0.3 advisories below affect ONLY the optional, experimental
  # `sandbox` feature (not built by default, not production). TODO: upgrade
  # wasmtime to >=43.0.1 when the WASM sandbox is finished, then drop these.
  "RUSTSEC-2026-0095",
  "RUSTSEC-2026-0096",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Zlib",
  # This project's own license (source-available, noncommercial).
  "PolyForm-Noncommercial-1.0.0",
]

[bans]
multiple-versions = "warn"
