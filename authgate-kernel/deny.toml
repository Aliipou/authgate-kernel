[advisories]
version = 2
ignore = [
  # RUSTSEC-2025-0020 — pyo3 <0.24.1 `PyString::from_object` buffer overflow.
  # Reviewed 2026-10-10. NOT REACHABLE: this crate never calls `PyString::from_object`
  # (grep src/ — zero uses). Fix needs pyo3 >=0.24.1, a multi-major Bound-API migration.
  # Re-review when pyo3 is upgraded, or by 2027-01-10 at the latest.
  "RUSTSEC-2025-0020",
  # RUSTSEC-2026-0177 — pyo3 <0.29 missing `Sync` bound on `PyCFunction::new_closure`.
  # Reviewed 2026-10-10. NOT REACHABLE: this crate never calls
  # `new_closure`/`new_closure_bound` (grep src/ — zero uses). Fix needs pyo3 >=0.29.
  # Re-review when pyo3 is upgraded, or by 2027-01-10 at the latest.
  "RUSTSEC-2026-0177",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Zlib",
]

[bans]
multiple-versions = "warn"
