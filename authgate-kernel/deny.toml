[advisories]
version = 2
ignore = [
  "RUSTSEC-2025-0020",
  # The advisories below are ALL transitive through wasmtime 25.0.3, which is
  # pulled in ONLY by the optional, experimental `sandbox` feature (not built by
  # default, not production — see TCB docs). They cannot be dropped without either
  # upgrading wasmtime to >=43.0.1 (an 18-major-version jump that breaks the
  # current sandbox.rs API usage) or removing the sandbox feature. TODO: upgrade
  # wasmtime and delete this block when the WASM sandbox is finished.
  "RUSTSEC-2024-0436",
  "RUSTSEC-2025-0046",
  "RUSTSEC-2025-0057",
  "RUSTSEC-2025-0118",
  "RUSTSEC-2026-0020",
  "RUSTSEC-2026-0021",
  "RUSTSEC-2026-0085",
  "RUSTSEC-2026-0086",
  "RUSTSEC-2026-0087",
  "RUSTSEC-2026-0088",
  "RUSTSEC-2026-0089",
  "RUSTSEC-2026-0091",
  "RUSTSEC-2026-0092",
  "RUSTSEC-2026-0093",
  "RUSTSEC-2026-0094",
  "RUSTSEC-2026-0095",
  "RUSTSEC-2026-0096",
]

[licenses]
version = 2
# The workspace's own crate is source-available/proprietary (license-file, publish = false).
# Skip license checks on private (unpublished) crates; only dependencies are gated below.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Zlib",
]

[bans]
multiple-versions = "warn"
