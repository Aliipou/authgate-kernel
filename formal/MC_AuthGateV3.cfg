\* TLC configuration for AuthGateV3 -- SHIPPED bound, selected by MCConstraint
\* Run: java -jar tla2tools.jar -workers auto -config MC_AuthGateV3.cfg MC_AuthGateV3.tla
\*
\* MCConstraint is currently Len(audit_log) <= 3, which does NOT complete.
\* For runs that finish, use MC_AuthGateV3_b1.cfg / _b2.cfg. See formal/tlc_runs/.

SPECIFICATION MCSpec

CONSTANTS
  Actors      <- MCActors
  Resources   <- MCResources
  ProofHashes <- MCProofHashes
  PublicKeys  <- MCPublicKeys
  RootKey     <- MCRootKey
  MaxChainDepth <- MCMaxChainDepth
  MaxEpoch    <- MCMaxEpoch
  Hash        <- MCHash

CONSTRAINT MCConstraint

INVARIANTS
  \* ── original ten (unchanged in meaning; none weakened) ──
  TypeInvariant
  EpochSafety
  IdentityBinding
  Attenuation
  RevocationSafety
  ResourceBinding
  ChainEpoch
  ChainComplete
  BigSafety
  PermitSoundness
  \* ── I5, which the shipped cfg omitted entirely ──
  CompositionMono
  \* ── independent invariants (tlc-remediation) ──
  NoPermitOnTamperedBinding
  RootKeyAuthority
  RootSignatureValid
  IntermediateSignatureValid
  WitnessLeafEpoch
  WitnessChainEpoch
  WitnessNotExpired
  WitnessAttenuation
  WitnessIdentityBinding
  WitnessChainComplete
  WitnessActorMatch
  WitnessResourceBinding
  WitnessRightsCoverage
  PermitHasWitness
  \* ── deny-completeness: the seven adversarial actions ──
  DenyBadSig
  DenyImpersonation
  DenyWrongActor
  DenyTampered
  DenyEscalation
  DenyStaleEpoch
  DenyStaleIntermediate
  DenyAttenEscalation
  DenyForgedRoot
  DenyOrphan
  DenyExpiredWhenPast

CHECK_DEADLOCK FALSE
