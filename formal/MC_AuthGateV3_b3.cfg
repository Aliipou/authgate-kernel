\* TLC configuration for AuthGateV3 -- BOUND 3 (Len(audit_log) <= 3) -- the SHIPPED bound
\* Run: java -jar tla2tools.jar -workers auto -config MC_AuthGateV3_b3.cfg MC_AuthGateV3.tla
\*
\* This is the only bound the audit ever completed (77257 states / 4227 distinct,
\* depth 9, ~3s) BEFORE the tlc-remediation changes. The state space is larger
\* now: revocation_history is ordered, and `now` is recorded per audit entry.

SPECIFICATION MCSpec

CONSTANTS
  Actors      <- MCActors
  Resources   <- MCResources
  ProofHashes <- MCProofHashes
  PublicKeys  <- MCPublicKeys
  RootKey     <- MCRootKey
  MaxChainDepth <- MCMaxChainDepth
  MaxEpoch    <- MCMaxEpoch
  Hash        <- MCHash

CONSTRAINT MCConstraint3

INVARIANTS
  \* ── original ten (unchanged in meaning; none weakened) ──
  TypeInvariant
  EpochSafety
  IdentityBinding
  Attenuation
  RevocationSafety
  ResourceBinding
  ChainEpoch
  ChainComplete
  BigSafety
  PermitSoundness
  \* ── I5, which the shipped cfg omitted entirely ──
  CompositionMono
  \* ── independent invariants (tlc-remediation) ──
  NoPermitOnTamperedBinding
  RootKeyAuthority
  RootSignatureValid
  IntermediateSignatureValid
  WitnessLeafEpoch
  WitnessChainEpoch
  WitnessNotExpired
  WitnessAttenuation
  WitnessIdentityBinding
  WitnessChainComplete
  WitnessActorMatch
  WitnessResourceBinding
  WitnessRightsCoverage
  PermitHasWitness
  \* ── deny-completeness: the seven adversarial actions ──
  DenyBadSig
  DenyImpersonation
  DenyWrongActor
  DenyTampered
  DenyEscalation
  DenyStaleEpoch
  DenyStaleIntermediate

CHECK_DEADLOCK FALSE
