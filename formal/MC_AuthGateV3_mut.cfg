\* MUTATION-TESTING cfg. BigSafety is deliberately OMITTED: it is a conjunction
\* of every other invariant here, so it always fires first and MASKS which
\* specific invariant caught the mutant. Every BigSafety conjunct is listed
\* individually below, so nothing is lost by dropping it.
\* Run: java -jar tla2tools.jar -workers auto -config MC_AuthGateV3_b1.cfg MC_AuthGateV3.tla
\*
\* This is the only bound the audit ever completed (77257 states / 4227 distinct,
\* depth 9, ~3s) BEFORE the tlc-remediation changes. The state space is larger
\* now: revocation_history is ordered, and `now` is recorded per audit entry.

SPECIFICATION MCSpec

CONSTANTS
  Actors      <- MCActors
  Resources   <- MCResources
  ProofHashes <- MCProofHashes
  PublicKeys  <- MCPublicKeys
  RootKey     <- MCRootKey
  MaxChainDepth <- MCMaxChainDepth
  MaxEpoch    <- MCMaxEpoch
  Hash        <- MCHash

CONSTRAINT MCConstraintMut

INVARIANTS
  \* ── original ten (unchanged in meaning; none weakened) ──
  TypeInvariant
  EpochSafety
  IdentityBinding
  Attenuation
  RevocationSafety
  ResourceBinding
  ChainEpoch
  ChainComplete
  PermitSoundness
  \* ── I5, which the shipped cfg omitted entirely ──
  CompositionMono
  \* ── independent invariants (tlc-remediation) ──
  NoPermitOnTamperedBinding
  RootKeyAuthority
  RootSignatureValid
  IntermediateSignatureValid
  WitnessLeafEpoch
  WitnessChainEpoch
  WitnessNotExpired
  WitnessAttenuation
  WitnessIdentityBinding
  WitnessChainComplete
  WitnessActorMatch
  WitnessResourceBinding
  WitnessRightsCoverage
  PermitHasWitness
  \* ── deny-completeness: the seven adversarial actions ──
  DenyBadSig
  DenyImpersonation
  DenyWrongActor
  DenyTampered
  DenyEscalation
  DenyStaleEpoch
  DenyStaleIntermediate
  DenyAttenEscalation
  DenyForgedRoot
  DenyOrphan
  DenyExpiredWhenPast

CHECK_DEADLOCK FALSE
