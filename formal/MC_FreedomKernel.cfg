\* TLC configuration for FreedomKernel -- first configuration this module has ever had.
\* Run: java -jar tla2tools.jar -workers auto -config MC_FreedomKernel.cfg MC_FreedomKernel.tla

SPECIFICATION Spec

CONSTANTS
  Humans    <- MCHumans
  Machines  <- MCMachines
  Resources <- MCResources
  MaxDepth  <- MCMaxDepth
  Claim     <- MCClaim
  ActionIR  <- MCActionIR

CONSTRAINT MCConstraint

INVARIANTS
  TypeInvariant
  OwnerlessMachineBlocked
  \* SovereigntyAlwaysBlocks is listed but is VACUOUS under this cfg -- the
  \* flags that would trigger it are pinned FALSE by MCActionIR. See the
  \* header of MC_FreedomKernel.tla. Do not cite a green result for it.
  SovereigntyAlwaysBlocks
  \* AttenuationHolds is asserted as a THEOREM at FreedomKernel.tla:238 and is
  \* EXPECTED TO FAIL. It quantifies over every pair of claims with different
  \* holders on the same resource where the delegator has can_delegate --
  \* requiring no delegation relation between them -- so two entirely unrelated
  \* claims must be confidence-ordered, in both directions at once. It is left
  \* in this cfg deliberately so the counterexample is regenerated on every run
  \* rather than remembered.
  AttenuationHolds

CHECK_DEADLOCK FALSE
