\* TLC configuration for FreedomKernel WITHOUT the refuted theorem.
\*
\* AttenuationHolds is omitted here. It is refuted -- see MC_FreedomKernel.cfg
\* and tlc_runs/20260806-230924_freedomkernel_first_ever_run.log. TLC halts at
\* the first invariant violation, so a run that includes it establishes nothing
\* about the other three. This cfg exists to give those three a real status.
\*
\* Run: ./run_tlc.sh MC_FreedomKernel_noatten <label> 900 MC_FreedomKernel.tla

SPECIFICATION Spec

CONSTANTS
  Humans    <- MCHumans
  Machines  <- MCMachines
  Resources <- MCResources
  MaxDepth  <- MCMaxDepth
  Claim     <- MCClaim
  ActionIR  <- MCActionIR

CONSTRAINT MCConstraint

INVARIANTS
  TypeInvariant
  OwnerlessMachineBlocked
  SovereigntyAlwaysBlocks

CHECK_DEADLOCK FALSE
