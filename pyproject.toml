[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authgate"
version = "1.0.0"
description = "Capability-security kernel for agent runtimes — typed authority verification with formal invariants"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
authors = [
  { name = "Ali Pourrahim", email = "Alipourrahim.ap@gmail.com" },
]
keywords = ["capability-security", "agent-runtimes", "formal-verification", "authority-verification", "rust", "formal-methods"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
# Ed25519-signed audit log (authgate.kernel.audit) — optional feature, lazy-imported.
signing = [
  "cryptography>=42.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "hypothesis>=6.0",
  "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/Aliipou/authgate"
Repository = "https://github.com/Aliipou/authgate"
Issues = "https://github.com/Aliipou/authgate/issues"

[project.scripts]
authgate-server = "authgate.api.app:main"
authgate-cli = "authgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/authgate"]
include = ["src/authgate/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# --------------------------------------------------------------------------- #
# Coverage configuration (branch `nazariye-azadi`).
#
# Goal: 100% reported coverage of all *reachable* code on the dev/CI host.
# Two categories are excluded, each documented and justified — never to hide
# untested logic, only to acknowledge code that cannot execute in this
# environment or by construction:
#   1. Linux-only syscall integration (seccomp) — unreachable on Windows/macOS
#      dev hosts; the enforcement it wraps is verified in the Rust TCB sandbox.
#   2. Defensive / unreachable branches (TYPE_CHECKING, abstract stubs,
#      "should-never-happen" raises) marked inline with `pragma: no cover`.
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["src/authgate"]
omit = [
  # Linux-only seccomp-bpf syscall filtering. The syscall-application paths
  # cannot run on the Windows/macOS dev host. Behaviour is covered by the
  # Rust TCB sandbox tests (authgate-kernel/src/sandbox.rs). Documented exclusion.
  "src/authgate/kernel/seccomp_executor.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "^\\s*\\.\\.\\.\\s*$",
  "pragma: no cover",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = false
ignore_missing_imports = true
